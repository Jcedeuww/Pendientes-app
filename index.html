<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendientes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#eef1ec;color:#1c2b27}
.dark body{background:#111816;color:#e6ede9}
.sheet{transition:transform .25s ease}
.chk{appearance:none;width:28px;height:28px;border-radius:9999px;border:2px solid #9aa9a2;flex:none;display:grid;place-items:center;cursor:pointer}
.chk:checked{background:#0f766e;border-color:#0f766e}
.chk:checked::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body class="min-h-screen">
<div class="max-w-md mx-auto px-4 pt-5 pb-32">

  <header class="flex items-start justify-between gap-3">
    <div>
      <h1 class="text-3xl font-extrabold tracking-tight">Pendientes</h1>
      <p id="resumen" class="text-sm opacity-70 mt-1"></p>
    </div>
    <button id="tema" aria-label="Cambiar tema" class="h-12 w-12 rounded-2xl bg-white dark:bg-[#1c2724] text-xl shadow-sm">🌙</button>
  </header>

  <button id="permiso" class="mt-4 w-full h-14 rounded-2xl bg-[#0f766e] text-white font-semibold text-base active:scale-[.98]">Permitir notificaciones</button>
  <p id="permisoInfo" class="text-xs opacity-60 mt-2 hidden"></p>

  <nav class="mt-5 grid grid-cols-3 gap-2 p-1 rounded-2xl bg-black/5 dark:bg-white/10" id="filtros">
    <button data-f="todas" class="h-11 rounded-xl text-sm font-semibold">Todas</button>
    <button data-f="pend" class="h-11 rounded-xl text-sm font-semibold">Pendientes</button>
    <button data-f="hechas" class="h-11 rounded-xl text-sm font-semibold">Hechas</button>
  </nav>

  <ul id="lista" class="mt-4 space-y-3"></ul>
  <p id="vacio" class="hidden text-center opacity-60 mt-16">No hay tareas aquí. Toca + para crear la primera.</p>
</div>

<!-- Aviso dentro de la app -->
<div id="aviso" class="fixed left-4 right-4 top-4 max-w-md mx-auto z-50 hidden rounded-2xl bg-[#0f766e] text-white p-4 shadow-lg" style="top:calc(env(safe-area-inset-top,0px) + 12px)">
  <div class="flex items-start gap-3">
    <div class="text-2xl">⏰</div>
    <div class="flex-1"><p class="font-bold" id="avisoT"></p><p class="text-sm opacity-90" id="avisoD"></p></div>
    <button id="avisoX" class="h-9 w-9 rounded-full bg-white/20" aria-label="Cerrar">✕</button>
  </div>
</div>

<!-- Botón añadir -->
<button id="nuevo" aria-label="Añadir tarea" class="fixed right-5 h-16 w-16 rounded-full bg-[#0f766e] text-white text-4xl shadow-xl active:scale-95" style="bottom:calc(env(safe-area-inset-bottom,0px) + 20px)">+</button>

<!-- Hoja inferior -->
<div id="fondo" class="fixed inset-0 bg-black/50 z-40 hidden"></div>
<form id="form" class="sheet fixed left-0 right-0 bottom-0 z-50 max-w-md mx-auto rounded-t-3xl bg-white dark:bg-[#1c2724] p-5 translate-y-full" style="padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)" onsubmit="return false">
  <h2 class="text-xl font-bold mb-4">Nueva tarea</h2>
  <label class="block text-sm font-medium mb-1" for="titulo">¿Qué tienes que hacer?</label>
  <input id="titulo" maxlength="80" class="w-full h-14 px-4 rounded-2xl bg-black/5 dark:bg-white/10 text-base outline-none focus:ring-2 focus:ring-[#0f766e]" placeholder="Ej. Enviar informe">
  <label class="block text-sm font-medium mt-4 mb-1" for="fecha">Fecha y hora</label>
  <input id="fecha" type="datetime-local" class="w-full h-14 px-4 rounded-2xl bg-black/5 dark:bg-white/10 text-base outline-none focus:ring-2 focus:ring-[#0f766e]">
  <p class="text-sm font-medium mt-4 mb-2">Categoría</p>
  <div id="cats" class="grid grid-cols-3 gap-2"></div>
  <p id="err" class="text-sm text-red-500 mt-3 hidden"></p>
  <div class="grid grid-cols-2 gap-3 mt-5">
    <button type="button" id="cancelar" class="h-14 rounded-2xl bg-black/5 dark:bg-white/10 font-semibold">Cancelar</button>
    <button type="submit" id="guardar" class="h-14 rounded-2xl bg-[#0f766e] text-white font-semibold">Guardar tarea</button>
  </div>
</form>

<script>
const CATS={Trabajo:{c:'#2563eb',e:'💼'},Personal:{c:'#16a34a',e:'🌿'},Urgente:{c:'#dc2626',e:'🔥'}};
const $=id=>document.getElementById(id);
let tareas=[],filtro='todas',cat='Trabajo';

/* ---------- Almacenamiento ---------- */
function cargar(){try{tareas=JSON.parse(localStorage.getItem('pendientes:v1')||'[]')}catch(e){tareas=[]}}
function guardar(){try{localStorage.setItem('pendientes:v1',JSON.stringify(tareas))}catch(e){}}
function getTema(){try{return localStorage.getItem('pendientes:tema')}catch(e){return null}}

/* ---------- Tema ---------- */
function aplicarTema(t){document.documentElement.classList.toggle('dark',t==='dark');$('tema').textContent=t==='dark'?'☀️':'🌙'}
$('tema').onclick=()=>{const t=document.documentElement.classList.contains('dark')?'light':'dark';aplicarTema(t);try{localStorage.setItem('pendientes:tema',t)}catch(e){}};
aplicarTema(getTema()||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));

/* ---------- Render ---------- */
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(iso){return new Date(iso).toLocaleString('es',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function render(){
  document.querySelectorAll('#filtros button').forEach(b=>{const on=b.dataset.f===filtro;b.className='h-11 rounded-xl text-sm font-semibold '+(on?'bg-white dark:bg-[#1c2724] shadow-sm':'opacity-60')});
  let l=[...tareas].sort((a,b)=>(a.done-b.done)||(a.due||'9').localeCompare(b.due||'9'));
  if(filtro==='pend')l=l.filter(t=>!t.done);
  if(filtro==='hechas')l=l.filter(t=>t.done);
  const pend=tareas.filter(t=>!t.done).length;
  $('resumen').textContent=pend?`${pend} ${pend===1?'tarea pendiente':'tareas pendientes'}`:'Todo al día';
  $('vacio').classList.toggle('hidden',l.length>0);
  const now=Date.now();
  $('lista').innerHTML=l.map(t=>{
    const k=CATS[t.cat],late=!t.done&&t.due&&new Date(t.due)<now;
    return `<li class="flex items-center gap-3 p-4 rounded-2xl bg-white dark:bg-[#1c2724] shadow-sm" style="border-left:6px solid ${k.c}">
      <input type="checkbox" class="chk" data-id="${t.id}" ${t.done?'checked':''} aria-label="Completar">
      <div class="flex-1 min-w-0">
        <p class="font-semibold text-base break-words ${t.done?'line-through opacity-50':''}">${esc(t.title)}</p>
        <p class="text-xs mt-1 ${late?'text-red-500 font-semibold':'opacity-60'}">${k.e} ${t.cat} · ${t.due?fmt(t.due):'Sin fecha'}${late?' · vencida':''}</p>
      </div>
      <button data-del="${t.id}" class="h-11 w-11 rounded-xl opacity-50 text-lg" aria-label="Eliminar">🗑</button>
    </li>`}).join('');
}
$('lista').addEventListener('click',e=>{
  const c=e.target.closest('[data-id]'),d=e.target.closest('[data-del]');
  if(c){const t=tareas.find(x=>x.id===c.dataset.id);if(t){t.done=c.checked;guardar();render()}}
  if(d){tareas=tareas.filter(x=>x.id!==d.dataset.del);guardar();render()}
});
$('filtros').onclick=e=>{const b=e.target.closest('button');if(b){filtro=b.dataset.f;render()}};

/* ---------- Formulario ---------- */
function pintarCats(){
  $('cats').innerHTML=Object.keys(CATS).map(n=>{const on=n===cat,k=CATS[n];
    return `<button type="button" data-cat="${n}" class="h-14 rounded-2xl text-sm font-semibold border-2" style="${on?`background:${k.c};border-color:${k.c};color:#fff`:`border-color:${k.c}55`}">${k.e} ${n}</button>`}).join('');
}
$('cats').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){cat=b.dataset.cat;pintarCats()}};
function abrir(){
  const d=new Date(Date.now()+3600000);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  $('fecha').value=d.toISOString().slice(0,16);$('titulo').value='';$('err').classList.add('hidden');
  cat='Trabajo';pintarCats();
  $('fondo').classList.remove('hidden');$('form').classList.remove('translate-y-full');
  setTimeout(()=>$('titulo').focus(),250);
}
function cerrar(){$('form').classList.add('translate-y-full');$('fondo').classList.add('hidden')}
$('nuevo').onclick=abrir;$('cancelar').onclick=cerrar;$('fondo').onclick=cerrar;
$('guardar').onclick=()=>{
  const title=$('titulo').value.trim(),due=$('fecha').value;
  if(!title){$('err').textContent='Escribe un título para la tarea.';$('err').classList.remove('hidden');return}
  tareas.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title,due:due?new Date(due).toISOString():'',cat,done:false,notified:false});
  guardar();render();cerrar();
};

/* ---------- Notificaciones ---------- */
function estadoPermiso(){
  const b=$('permiso'),i=$('permisoInfo');
  if(!('Notification' in window)){b.textContent='Notificaciones no disponibles';b.disabled=true;b.className=b.className.replace('bg-[#0f766e]','bg-gray-500');i.textContent='Este navegador no admite la API de notificaciones. Verás avisos dentro de la app.';i.classList.remove('hidden');return}
  const p=Notification.permission;
  if(p==='granted'){b.textContent='✓ Notificaciones activadas';b.className='mt-4 w-full h-14 rounded-2xl bg-[#0f766e]/15 text-[#0f766e] dark:text-[#5eead4] font-semibold';i.textContent='Recibirás un aviso cuando llegue la hora de cada tarea.';i.classList.remove('hidden')}
  else if(p==='denied'){b.textContent='Notificaciones bloqueadas';i.textContent='Actívalas desde los ajustes del navegador. Mientras tanto verás avisos dentro de la app.';i.classList.remove('hidden')}
}
$('permiso').onclick=async()=>{
  if(!('Notification' in window))return;
  try{await Notification.requestPermission()}catch(e){}
  estadoPermiso();
  if(Notification.permission==='granted')lanzar('Notificaciones activadas','Te avisaremos cuando llegue la hora de tus tareas.');
};
function lanzar(titulo,cuerpo){
  mostrarAviso(titulo,cuerpo);
  try{if('Notification' in window&&Notification.permission==='granted'){
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){navigator.serviceWorker.ready.then(r=>r.showNotification(titulo,{body:cuerpo,tag:titulo,icon:'icon-192.png',badge:'icon-192.png',vibrate:[200,100,200]})).catch(()=>new Notification(titulo,{body:cuerpo,tag:titulo}))}
    else new Notification(titulo,{body:cuerpo,tag:titulo})}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
let avisoTimer;
function mostrarAviso(t,d){$('avisoT').textContent=t;$('avisoD').textContent=d;$('aviso').classList.remove('hidden');clearTimeout(avisoTimer);avisoTimer=setTimeout(()=>$('aviso').classList.add('hidden'),8000)}
$('avisoX').onclick=()=>$('aviso').classList.add('hidden');

function revisar(){
  const now=Date.now();let cambio=false;
  tareas.forEach(t=>{
    if(!t.done&&t.due&&!t.notified&&new Date(t.due)<=now){
      t.notified=true;cambio=true;
      lanzar('Es hora: '+t.title,CATS[t.cat].e+' '+t.cat+' · '+fmt(t.due));
    }
  });
  if(cambio){guardar();render()}
}
setInterval(revisar,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)revisar()});

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
cargar();render();estadoPermiso();revisar();
</script>
</body>
</html>
